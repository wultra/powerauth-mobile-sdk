name: Android Build

on:
  push:
    branches:
      - develop
      - master
      - releases/*
      - feature/crypto4
    paths:
      - ".gitmodules"
      - "cc7"
      - "scripts/**"
      - "src/PowerAuth/**"
      - "src/PowerAuthJni/**"
      - "src/PowerAuthTests/**"
      - "include/**"
      - "proj-android/**"
  pull_request:
    paths:
      - ".gitmodules"
      - "cc7"
      - "scripts/**"
      - "src/PowerAuth/**"
      - "src/PowerAuthJni/**"
      - "src/PowerAuthTests/**"
      - "include/**"
      - "proj-android/**"
  schedule:
    - cron: '30 6 * * 1'

jobs:
  build:
    name: Build Android platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3
        with:
            submodules: 'recursive'
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Build library
        run: ./scripts/test-build.sh android -v2