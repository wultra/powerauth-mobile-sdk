name: build

on:
  push:
    branches:
      - develop
      - master
      - releases/*
  pull_request:
  schedule:
    - cron: '30 6 * * 1'

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3
        with:
            submodules: 'recursive'
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Set proper Xcode version
        run: sudo xcode-select -s "/Applications/Xcode_16.4.app"
      - name: Build library
        run: ./scripts/test-build.sh script android -v2