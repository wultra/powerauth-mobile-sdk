name: iOS Tests

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:

jobs:
  tests:
    name: iOS Tests
    runs-on: macos-26
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set proper Xcode version
        run: ./scripts/xcode-select.sh
      - name: Run iOS tests
        env:
          TESTS_CONFIG: ${{ secrets.IOS_TESTS_CONFIG }}
        # Exercise the most commonly used PowerAuth algorithms; simulator biometry is excluded in CI.
        run: |
          ./scripts/test.sh \
            -config "$TESTS_CONFIG" \
            -algorithms "LEGACY_P256,EC_P384_ML_L3" \
            -biometry off \
            -crash-on-failure on
