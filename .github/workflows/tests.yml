name: Tests

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # The integration tests are slow and use expensive runners (especially macOS), so we want to avoid
      # them when a change cannot affect the result, for example when only documentation was modified.
      # The workflow cannot use "paths" filters, because skipped workflows would leave the required checks
      # of the test matrix pending. Instead, this job compares the changed files with the base commit and
      # the test jobs below start and report success immediately when there's nothing to test.
      - name: Detect code changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]] || base="$PUSH_BEFORE_SHA" ;;
          esac
          ios=true
          android=true
          if [[ -n "$base" ]] && git fetch -q --depth=1 origin "$base"; then
            ios=false
            android=false
            while IFS= read -r file; do
              case "$file" in
                *.md) ;;
                .gitmodules | cc7 | include/* | src/PowerAuth/* | src/PowerAuthTests/* | \
                scripts/test-server.sh | .github/workflows/tests.yml)
                  ios=true
                  android=true
                  ;;
                proj-xcode/* | Package.swift | scripts/test.sh) ios=true ;;
                proj-android/* | src/PowerAuthJni/* | src/Android.mk | scripts/android-test.sh) android=true ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi
          echo "iOS tests: $ios, Android tests: $android"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  # The test jobs always run so that checks are reported, but they exit early when no code has changed.

  # Unit tests do not communicate with PowerAuth Server, so they run once, on a machine without the servers.
  ios-unit:
    name: iOS Unit Tests
    needs: changes
    # The unit tests contain timing-sensitive tests, which fail when the standard runner stalls.
    # The larger runner is an attempt to make them stable.
    runs-on: xcode-27-xlarge
    timeout-minutes: 60
    env:
      RUN_TESTS: ${{ needs.changes.outputs.ios }}
    steps:
      - name: Skip when no code has changed
        if: env.RUN_TESTS != 'true'
        run: echo "No iOS related code changes detected, skipping tests."

      - name: Checkout the repo
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run iOS unit tests
        if: env.RUN_TESTS == 'true'
        # The CC7 tests of the submodule are skipped, because they assert, for example, that a 10 ms sleep
        # takes less than 20 ms, which is not reliable on a virtual machine.
        run: ./scripts/test.sh -tests unit -cc7 off

  ios-integration:
    name: iOS Integration Tests (server ${{ matrix.server }}, ${{ matrix.algorithms }})
    needs: changes
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RUN_TESTS: ${{ needs.changes.outputs.ios }}
    strategy:
      fail-fast: false
      matrix:
        # PowerAuth Server versions with SDK algorithms, shared by all platforms.
        include: &server-matrix
          # PowerAuth Server 1.x supports only the legacy V3 protocol.
          - server: 1.9.3
            enrollment: 1.9.2
            algorithms: LEGACY_P256
          # The latest PowerAuth Server and Enrollment Server releases.
          - server: latest
            enrollment: latest
            algorithms: EC_P384_ML_L3
    steps:
      - name: Skip when no code has changed
        if: env.RUN_TESTS != 'true'
        run: echo "No iOS related code changes detected, skipping tests."

      - name: Checkout the repo
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        if: env.RUN_TESTS == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install PostgreSQL
        if: env.RUN_TESTS == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install postgresql@17
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"

      - name: Start PowerAuth Server ${{ matrix.server }}
        if: env.RUN_TESTS == 'true'
        run: ./scripts/test-server.sh start -server "${{ matrix.server }}" -enrollment "${{ matrix.enrollment }}"

      - name: Run iOS tests
        if: env.RUN_TESTS == 'true'
        # Simulator biometry is excluded in CI.
        run: |
          ./scripts/test.sh \
            -tests integration \
            -config '{"enrollmentUrl":"http://localhost:8081/enrollment-server","serverApiUrl":"http://localhost:8080/powerauth-java-server"}' \
            -algorithms "${{ matrix.algorithms }}" \
            -biometry off \
            -crash-on-failure on

      - name: Upload server logs
        if: failure() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-server-logs-${{ matrix.server }}
          path: ${{ runner.temp }}/powerauth-test-server/logs

  android-unit:
    name: Android Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_TESTS: ${{ needs.changes.outputs.android }}
    steps:
      - name: Skip when no code has changed
        if: env.RUN_TESTS != 'true'
        run: echo "No Android related code changes detected, skipping tests."

      - name: Checkout the repo
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        if: env.RUN_TESTS == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Enable KVM
        if: env.RUN_TESTS == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android unit tests
        if: env.RUN_TESTS == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/android-test.sh -tests unit

      - name: Upload test reports
        if: failure() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: proj-android/PowerAuthLibrary/build/reports/androidTests

  android-integration:
    name: Android Integration Tests (server ${{ matrix.server }}, ${{ matrix.algorithms }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_TESTS: ${{ needs.changes.outputs.android }}
    strategy:
      fail-fast: false
      matrix:
        include: *server-matrix
    steps:
      - name: Skip when no code has changed
        if: env.RUN_TESTS != 'true'
        run: echo "No Android related code changes detected, skipping tests."

      - name: Checkout the repo
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        if: env.RUN_TESTS == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Use preinstalled PostgreSQL
        if: env.RUN_TESTS == 'true'
        run: printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"

      - name: Start PowerAuth Server ${{ matrix.server }}
        id: server
        if: env.RUN_TESTS == 'true'
        run: ./scripts/test-server.sh start -server "${{ matrix.server }}" -enrollment "${{ matrix.enrollment }}"

      - name: Build library and tests
        if: env.RUN_TESTS == 'true'
        working-directory: proj-android
        run: ./gradlew --no-daemon :PowerAuthLibrary:assembleDebugAndroidTest

      - name: Enable KVM
        if: env.RUN_TESTS == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        if: env.RUN_TESTS == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The emulator has no enrolled biometry in CI.
          script: ./scripts/android-test.sh -tests integration -server-version "${{ steps.server.outputs.server-version }}" -algorithms "${{ matrix.algorithms }}" -biometry off

      - name: Upload logs and test reports
        if: failure() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-logs-${{ matrix.server }}
          path: |
            ${{ runner.temp }}/powerauth-test-server/logs
            proj-android/PowerAuthLibrary/build/reports/androidTests
